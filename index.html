<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mandi Fresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a market stall. Quiet green ground, produce on white cards, and one loud thing,
   the yellow hang-tag price. Admin reuses the same tokens in tables and order cards. */
:root{
  --bg:#F1F5EE; --surface:#FFFFFF; --field:#FFFFFF; --ink:#16241B; --muted:#56675B; --line:#D6E0D3;
  --accent:#1F6B3A; --accent-ink:#FFFFFF; --accent-soft:#E2F0E5;
  --sale:#C23A1F; --sale-soft:#FBE8E2; --warn:#8A5A00; --warn-soft:#FBEFCF; --info:#1D4F91; --info-soft:#E1ECFA;
  --tag:#F7D54A; --tag-ink:#231B00;
  --t-Vegetables:#DDEFD8; --t-Leafy:#CBE7CF; --t-Fruits:#FBE3D3; --t-other:#E8EBDD;
  --shadow:0 1px 2px rgba(22,36,27,.06),0 10px 28px rgba(22,36,27,.08);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1712; --surface:#15221A; --field:#0F1A13; --ink:#E4EEE6; --muted:#94A89A; --line:#27382D;
    --accent:#6BC98B; --accent-ink:#06140B; --accent-soft:#193524;
    --sale:#FF8467; --sale-soft:#3A1E17; --warn:#E8B64B; --warn-soft:#352A0D; --info:#8DB8F0; --info-soft:#15263C;
    --tag:#E9C940; --tag-ink:#1D1600;
    --t-Vegetables:#1B3322; --t-Leafy:#1F3A27; --t-Fruits:#3B2A1B; --t-other:#26301F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,40px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
code{font-family:var(--f-mono);font-size:.92em;background:var(--accent-soft);padding:1px 6px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:14px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{text-decoration:none;margin-right:auto}
.nav{display:flex;gap:4px}
.navlink{text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.navlink:hover{background:var(--accent-soft);color:var(--ink)}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 13px var(--f-mono);margin-left:6px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}

/* the hang-tag price */
.ptag{position:relative;display:inline-block;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:600;
  padding:5px 12px 5px 22px;clip-path:polygon(11px 0,100% 0,100% 100%,11px 100%,0 50%);white-space:nowrap}
.ptag::before{content:"";position:absolute;left:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--surface)}
.ptag small{font-weight:500;font-size:.78em}
.brand .ptag{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand .ptag::before{background:var(--bg)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--sale)}
.btn.sm{min-height:34px;padding:4px 11px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:14px;font-weight:600}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:80px}
input[type=checkbox]{width:auto;min-height:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.err{color:var(--sale);font-size:14px;font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.p-placed{background:var(--warn-soft);color:var(--warn)}
.p-confirmed,.p-out_for_delivery{background:var(--info-soft);color:var(--info)}
.p-delivered{background:var(--accent-soft);color:var(--accent)}
.p-cancelled,.p-low{background:var(--sale-soft);color:var(--sale)}
.p-ok{background:var(--accent-soft);color:var(--accent)}

/* shop */
main{padding-block:22px 110px}
.mast{display:grid;gap:8px;margin-bottom:18px}
.mast .sub{color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:10px;font-weight:600}
.controls{display:grid;gap:12px;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px;min-width:0}
.sw{position:relative;border-radius:10px;display:grid;place-items:center;aspect-ratio:4/3;background:var(--t-other)}
.sw[data-cat="Vegetables"]{background:var(--t-Vegetables)}
.sw[data-cat="Leafy greens"]{background:var(--t-Leafy)}
.sw[data-cat="Fruits"]{background:var(--t-Fruits)}
.sw .emo{font-size:52px;line-height:1}
.sw .off{position:absolute;right:6px;top:6px;background:var(--sale);color:#fff;font:600 12px var(--f-mono);padding:2px 7px;border-radius:6px}
.sw .tagchip{position:absolute;left:6px;bottom:6px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.sw.sm{width:44px;aspect-ratio:1;flex:none;border-radius:10px}
.sw.sm .emo{font-size:24px}
.priceRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mrp{color:var(--muted);font:500 13px var(--f-mono)}
.stock{font-size:13px;font-weight:600;min-height:19px}
.stock.low{color:var(--warn)} .stock.out{color:var(--sale)}
.card .act{margin-top:auto}
.card.is-out .sw,.card.is-out h3{opacity:.55}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border:1px solid var(--accent);border-radius:10px;overflow:hidden;background:var(--accent-soft)}
.stepper button{border:0;background:transparent;min-height:42px;font-size:20px;font-weight:700;cursor:pointer;color:var(--accent)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper .qv{text-align:center;font:600 14px var(--f-mono)}
.empty{grid-column:1/-1;padding:36px 16px;text-align:center;color:var(--muted)}

/* basket bar + drawer */
.basketbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;
  display:flex;gap:16px;align-items:center;justify-content:space-between;width:min(560px,calc(100% - 32px));border:0;border-radius:14px;padding:14px 18px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.basketbar strong{font-family:var(--f-mono)}
.scrim{position:fixed;inset:0;background:rgba(8,16,11,.5);z-index:30;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:31;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:var(--shadow)}
.drawer.open{display:flex}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dbody{flex:1;overflow:auto;padding:14px 16px;display:grid;gap:14px;align-content:start}
.dfoot{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.line{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.line .nm{font-weight:600;min-width:0}
.line .stepper{grid-template-columns:34px 64px 34px;margin-top:6px}
.line .stepper button{min-height:34px}
.mono{font-family:var(--f-mono)}
.totals{display:grid;gap:6px}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .grand{font-weight:700;font-size:18px;border-top:1px dashed var(--line);padding-top:8px}
.save{color:var(--accent);font-weight:600}
.donebox{display:grid;gap:12px;justify-items:start}
.oid{font:600 22px var(--f-mono)}

/* orders */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 180px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{font-size:13px;font-weight:600;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.steps li.done{border-color:var(--accent);color:var(--ink)}
.steps li.now{border-color:var(--accent);color:var(--accent)}
.items{display:grid;gap:4px;font-size:15px}
.items div{display:flex;justify-content:space-between;gap:12px}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .chip{border-radius:10px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:600 26px var(--f-mono)}
.stat span{font-size:14px;color:var(--muted)}
.stat.alert b{color:var(--sale)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1 1 220px}
.toolbar select{width:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.itemcell{display:flex;gap:10px;align-items:center;min-width:170px}
.cellwrap{display:flex;align-items:center;gap:6px;white-space:nowrap}
.cell{width:92px;min-height:38px;padding:6px 8px;font-family:var(--f-mono)}
.switch{position:relative;width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--line);cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.ohead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.short{color:var(--sale);font-size:14px;font-weight:600}
.modalwrap{position:fixed;inset:0;z-index:40;background:rgba(8,16,11,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;padding:18px;width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:14px;box-shadow:var(--shadow)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .wide{grid-column:1/-1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--sale);color:#fff}
.toast[hidden]{display:none}
@media (max-width:560px){
  .nav{order:3;width:100%;overflow-x:auto}
  .formgrid{grid-template-columns:1fr}
  main{padding-top:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<main class="wrap" id="main"></main>
<div id="bar"></div>
<div id="drawer"></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">This shop needs JavaScript to run.</p></noscript>

<script>
'use strict';

/* ------------------------------------------------------------------
   SETUP: paste your Apps Script Web app URL between the quotes.
   Leave it empty to try the shop in demo mode (data stays in this browser).
------------------------------------------------------------------- */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwgZWgB3p15wotlULPZ2nBxyQxxmDAiynajACHq-9UOY1U0db6TaeLoagGLbVsstk3d/exec',
  CURRENCY: '₹'
};

const LOW = 5;
const UNITS = ['kg', 'dozen', 'pc', 'bunch'];
const NEXT_STATUS = {
  placed: [['confirmed', 'Confirm order'], ['cancelled', 'Cancel order']],
  confirmed: [['out_for_delivery', 'Out for delivery'], ['cancelled', 'Cancel order']],
  out_for_delivery: [['delivered', 'Mark delivered'], ['cancelled', 'Cancel order']],
  delivered: [], cancelled: []
};
const STATUS_LABEL = { placed: 'Order placed', confirmed: 'Confirmed', out_for_delivery: 'Out for delivery', delivered: 'Delivered', cancelled: 'Cancelled' };
const STEP_ORDER = ['placed', 'confirmed', 'out_for_delivery', 'delivered'];
const DEFAULT_SETTINGS = { shopName: 'Mandi Fresh', deliveryFee: 30, freeAbove: 300, announcement: '' };

/* ------------------------------ helpers ------------------------------ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const money = n => { n = r2(num(n)); return CONFIG.CURRENCY + n.toLocaleString('en-IN', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 }); };
const stepOf = u => (u === 'kg' ? 0.5 : 1);
const qtyText = (q, u) => r2(q) + ' ' + u;
const digits = v => String(v == null ? '' : v).replace(/\D/g, '').slice(-10);
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); };
const inStock = p => p.available !== false && num(p.stock) > 0;
const isLow = p => inStock(p) && num(p.stock) <= LOW;
const offPct = p => (num(p.mrp) > num(p.price) ? Math.round((1 - num(p.price) / num(p.mrp)) * 100) : 0);
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage may be blocked */ } }
};

/* ------------------------------ demo backend ------------------------------ */
/* Mirrors Code.gs so the site works before your sheet is connected. */
const SEED = [
  ['Tomato', '🍅', 'Vegetables', 'kg', 40, 48, 60, true, 'Farm fresh'], ['Onion', '🧅', 'Vegetables', 'kg', 35, 42, 80, true, ''],
  ['Potato', '🥔', 'Vegetables', 'kg', 30, 36, 100, true, ''], ['Brinjal', '🍆', 'Vegetables', 'kg', 45, 55, 25, true, ''],
  ['Carrot', '🥕', 'Vegetables', 'kg', 50, 60, 40, true, 'Crunchy'], ['Cucumber', '🥒', 'Vegetables', 'kg', 35, 40, 30, true, ''],
  ['Okra (Bhindi)', '🫛', 'Vegetables', 'kg', 60, 72, 20, true, ''], ['Capsicum', '🫑', 'Vegetables', 'kg', 70, 85, 15, true, ''],
  ['Green chilli', '🌶️', 'Vegetables', 'kg', 80, 100, 4, true, ''], ['Garlic', '🧄', 'Vegetables', 'kg', 180, 220, 12, true, ''],
  ['Sweet corn', '🌽', 'Vegetables', 'pc', 15, 20, 40, true, ''], ['Spinach (Palak)', '🥬', 'Leafy greens', 'bunch', 20, 25, 30, true, 'Picked today'],
  ['Coriander', '🌿', 'Leafy greens', 'bunch', 15, 20, 35, true, ''], ['Mint', '🌱', 'Leafy greens', 'bunch', 12, 15, 25, true, ''],
  ['Banana', '🍌', 'Fruits', 'dozen', 60, 72, 20, true, ''], ['Apple', '🍎', 'Fruits', 'kg', 160, 190, 30, true, ''],
  ['Orange', '🍊', 'Fruits', 'kg', 90, 110, 25, true, ''], ['Grapes', '🍇', 'Fruits', 'kg', 110, 140, 18, true, ''],
  ['Watermelon', '🍉', 'Fruits', 'kg', 28, 35, 50, true, ''], ['Guava', '🍐', 'Fruits', 'kg', 70, 85, 3, true, ''],
  ['Coconut', '🥥', 'Fruits', 'pc', 35, 40, 45, true, ''], ['Pineapple', '🍍', 'Fruits', 'pc', 60, 75, 0, false, '']
].map((r, i) => ({ id: 'p' + (100 + i), name: r[0], emoji: r[1], category: r[2], unit: r[3], price: r[4], mrp: r[5], stock: r[6], available: r[7], tag: r[8] }));

const Demo = (() => {
  const KEY = 'mf-demo-v1', PASSWORD = 'admin123';
  let mem = null;
  const db = () => {
    if (mem) return mem;
    const s = store.get(KEY, null);
    mem = s && s.products ? s : { products: JSON.parse(JSON.stringify(SEED)), orders: [], settings: { ...DEFAULT_SETTINGS } };
    return mem;
  };
  const persist = () => store.set(KEY, mem);
  const clone = o => JSON.parse(JSON.stringify(o));
  const fail = m => { throw new Error(m); };
  const auth = d => { if (d.password !== PASSWORD) fail('Wrong password'); };
  const snapshot = () => { const s = db(); return clone({ settings: s.settings, products: s.products, orders: [...s.orders].sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt)) }); };
  const view = o => ({ orderId: o.orderId, createdAt: o.createdAt, status: o.status, name: o.name, address: o.address, items: clone(o.items), subtotal: o.subtotal, delivery: o.delivery, total: o.total });
  const restockIfReserved = o => {
    if (!o.reserved) return;
    o.items.forEach(it => { const p = db().products.find(x => x.id === it.id); if (p) p.stock = r2(p.stock + it.qty); });
    o.reserved = false;
  };
  const move = (o, to) => {
    const ok = (NEXT_STATUS[o.status] || []).some(x => x[0] === to);
    if (!ok) fail('Cannot move an order from ' + o.status + ' to ' + to);
    if (to === 'cancelled') restockIfReserved(o);
    o.status = to; o.updatedAt = new Date().toISOString();
  };
  const actions = {
    catalog() { const s = db(); return { settings: clone(s.settings), products: clone(s.products) }; },
    placeOrder(d) {
      if (d.website) fail('Could not place this order');
      const c = d.customer || {}, s = db();
      const name = String(c.name || '').trim(), phone = digits(c.phone), address = String(c.address || '').trim();
      if (name.length < 2) fail('Please enter your name');
      if (phone.length !== 10) fail('Please enter a 10-digit mobile number');
      if (address.length < 6) fail('Please enter your delivery address');
      const want = {};
      (d.items || []).forEach(it => { if (it && it.id && num(it.qty) > 0) want[it.id] = r2((want[it.id] || 0) + num(it.qty)); });
      const ids = Object.keys(want);
      if (!ids.length) fail('Your basket is empty');
      const lines = []; let subtotal = 0;
      ids.forEach(id => {
        const p = s.products.find(x => x.id === id);
        if (!p) fail('One of the items is no longer sold. Please refresh the page.');
        const q = want[id], st = stepOf(p.unit);
        if (q < st || Math.abs(q / st - Math.round(q / st)) > 1e-9) fail(p.name + ' is sold in steps of ' + st + ' ' + p.unit);
        if (!p.available || p.stock <= 0) fail(p.name + ' is out of stock');
        if (q > p.stock) fail('Only ' + p.stock + ' ' + p.unit + ' of ' + p.name + ' left');
        const lt = r2(p.price * q); subtotal = r2(subtotal + lt);
        lines.push({ p, item: { id: p.id, name: p.name, emoji: p.emoji, unit: p.unit, qty: q, price: p.price, mrp: p.mrp, lineTotal: lt } });
      });
      const hourAgo = Date.now() - 3600000;
      if (s.orders.filter(o => o.phone === phone && Date.parse(o.createdAt) > hourAgo).length >= 5) fail('Too many orders from this number. Please try again later.');
      const delivery = subtotal >= s.settings.freeAbove ? 0 : num(s.settings.deliveryFee);
      lines.forEach(l => { l.p.stock = r2(l.p.stock - l.item.qty); });
      let orderId; do { orderId = 'MF-' + Math.random().toString(36).slice(2, 7).toUpperCase(); } while (s.orders.some(o => o.orderId === orderId));
      const now = new Date().toISOString();
      const o = { orderId, createdAt: now, status: 'placed', name, phone, address, note: String(c.note || '').trim(), items: lines.map(l => l.item), subtotal, delivery, total: r2(subtotal + delivery), reserved: true, updatedAt: now };
      s.orders.push(o); persist();
      return { order: view(o) };
    },
    track(d) { const o = db().orders.find(x => x.orderId === String(d.orderId || '').trim().toUpperCase()); if (!o || o.phone !== digits(d.phone)) fail('No order found for that order ID and mobile number'); return { order: view(o) }; },
    cancelOrder(d) {
      const o = db().orders.find(x => x.orderId === String(d.orderId || '').trim().toUpperCase());
      if (!o || o.phone !== digits(d.phone)) fail('No order found for that order ID and mobile number');
      if (o.status !== 'placed') fail('This order has already been confirmed. Please call the shop to cancel it.');
      move(o, 'cancelled'); persist(); return { order: view(o) };
    },
    adminData(d) { auth(d); return { data: snapshot() }; },
    adminSaveProduct(d) {
      auth(d); const s = db(), inp = d.product || {};
      const ex = inp.id ? s.products.find(x => x.id === inp.id) : null;
      if (inp.id && !ex) fail('That product no longer exists');
      const p = { ...(ex || { id: 'p' + Date.now().toString(36), emoji: '🥬', category: 'Vegetables', unit: 'kg', price: 0, mrp: 0, stock: 0, available: true, tag: '', name: '' }) };
      Object.keys(inp).forEach(k => { if (k in p) p[k] = inp[k]; });
      p.name = String(p.name || '').trim().slice(0, 60); if (!p.name) fail('Product name is required');
      p.emoji = String(p.emoji || '').trim().slice(0, 8); p.category = String(p.category || 'Vegetables').trim().slice(0, 30); p.tag = String(p.tag || '').trim().slice(0, 24);
      if (!UNITS.includes(p.unit)) fail('Unit must be one of: ' + UNITS.join(', '));
      p.price = r2(num(p.price)); p.mrp = r2(num(p.mrp)); p.stock = r2(num(p.stock)); p.available = !!p.available;
      if (p.price <= 0) fail('Selling price must be more than 0');
      if (!p.mrp) p.mrp = p.price;
      if (p.mrp < p.price) fail('MRP cannot be lower than the selling price');
      if (p.stock < 0) fail('Stock cannot be negative');
      if (ex) Object.assign(ex, p); else s.products.push(p);
      persist(); return { data: snapshot() };
    },
    adminDeleteProduct(d) { auth(d); const s = db(), i = s.products.findIndex(x => x.id === d.id); if (i < 0) fail('That product no longer exists'); s.products.splice(i, 1); persist(); return { data: snapshot() }; },
    adminSetStatus(d) { auth(d); const o = db().orders.find(x => x.orderId === d.orderId); if (!o) fail('Order not found'); move(o, d.status); persist(); return { data: snapshot() }; },
    adminSaveSettings(d) {
      auth(d); const s = d.settings || {}, name = String(s.shopName || '').trim().slice(0, 40);
      if (!name) fail('Shop name is required');
      if (num(s.deliveryFee) < 0 || num(s.freeAbove) < 0) fail('Delivery amounts cannot be negative');
      db().settings = { shopName: name, deliveryFee: num(s.deliveryFee), freeAbove: num(s.freeAbove), announcement: String(s.announcement || '').trim().slice(0, 160) };
      persist(); return { data: snapshot() };
    }
  };
  return { run: async (action, d) => { await new Promise(r => setTimeout(r, 80)); if (!actions[action]) fail('Unknown action'); return { ok: true, ...actions[action](d || {}) }; } };
})();

/* ------------------------------ api ------------------------------ */
async function call(action, data) {
  if (!CONFIG.API_URL) return Demo.run(action, data);
  let res;
  try {
    res = action === 'catalog'
      ? await fetch(CONFIG.API_URL + '?action=catalog')
      : await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action, ...data }) });
  } catch (e) {
    throw new Error('Could not reach the shop server. Check your internet connection and try again.');
  }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('The shop server sent an unexpected reply. Check the Apps Script deployment.'); }
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}

};

try { state.admin.pw = sessionStorage.getItem('mf-admin-pw') || ''; } catch (e) { /* ignore */ }

const byId = id => state.products.find(p => p.id === id);
const isTyping = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && document.body.contains(a)); };

/* ------------------------------ cart ------------------------------ */
function cartTotals() {
  const ls = Object.entries(state.cart).map(([id, q]) => { const p = byId(id); return p ? { p, q, total: r2(num(p.price) * q) } : null; }).filter(Boolean);
  const subtotal = r2(ls.reduce((a, l) => a + l.total, 0));
  const mrpTotal = r2(ls.reduce((a, l) => a + num(l.p.mrp) * l.q, 0));
  const s = state.settings;
  const delivery = ls.length ? (subtotal >= num(s.freeAbove) ? 0 : num(s.deliveryFee)) : 0;
  return { ls, subtotal, delivery, total: r2(subtotal + delivery), save: r2(mrpTotal - subtotal), count: ls.length };
}
function maxQty(p) { const st = stepOf(p.unit); return inStock(p) ? Math.floor(num(p.stock) / st + 1e-9) * st : 0; }
function setQty(id, q) {
  const p = byId(id); if (!p) return;
  q = r2(q);
  const max = maxQty(p);
  if (q > max) { q = max; toast('Only ' + qtyText(max, p.unit) + ' of ' + p.name + ' in stock'); }
  if (q <= 0) delete state.cart[id]; else state.cart[id] = q;
  store.set('mf-cart', state.cart);
  renderGrid(); renderBar(); renderHeader(); renderDrawer();
}
function reconcileCart() {
  let changed = false;
  Object.keys(state.cart).forEach(id => {
    const p = byId(id);
    if (!p || !inStock(p)) { delete state.cart[id]; changed = true; return; }
    const max = maxQty(p);
    if (state.cart[id] > max) { state.cart[id] = max; changed = true; }
  });
  if (changed) { store.set('mf-cart', state.cart); toast('Your basket was updated to match what is in stock'); }
}

function keepFocus(fn) {
  const a = document.activeElement;
  const key = a && a.dataset && a.dataset.act ? [a.dataset.act, a.dataset.id || ''] : null;
  fn();
  if (key) {
    try { const el = document.querySelector('[data-act="' + key[0] + '"][data-id="' + String(key[1]).replace(/["\\]/g, '\\$&') + '"]'); if (el && !el.disabled) el.focus(); } catch (e) { /* selector could not be built */ }
  }
}
function renderAll() { renderHeader(); renderMain(); renderBar(); renderDrawer(); renderModal(); }

}

function cardHTML(p) {

  const fresh = a.orders.filter(o => o.status === 'placed').length;
  const tabs = [['products', 'Products'], ['orders', 'Orders' + (fresh ? ' (' + fresh + ' new)' : '')], ['settings', 'Settings']];
  return `<section class="stack"><div class="ohead"><h1>Shop admin</h1><div class="acts"><button class="btn sm" data-act="aRefresh">Refresh</button><button class="btn sm" data-act="aLogout">Log out</button></div></div>
    <div class="summary"><div class="stat"><b>${live}</b><span>Products on sale</span></div><div class="stat${low ? ' alert' : ''}"><b>${low}</b><span>Low or out of stock (${LOW} or fewer)</span></div><div class="stat${fresh ? ' alert' : ''}"><b>${fresh}</b><span>New orders to confirm</span></div></div>
    <div class="tabs" role="group" aria-label="Admin sections">${tabs.map(t => `<button class="chip" data-act="aTab" data-id="${t[0]}" aria-pressed="${a.tab === t[0]}">${t[1]}</button>`).join('')}</div>
    ${a.tab === 'products' ? adminProductsHTML() : a.tab === 'orders' ? adminOrdersHTML() : adminSettingsHTML()}</section>`;
}
function adminFiltered() {
  const a = state.admin, q = a.psearch.trim().toLowerCase();
  return state.products.filter(p => {
    if (q && !p.name.toLowerCase().includes(q)) return false;
    if (a.pfilter === 'low') return p.available !== false && num(p.stock) > 0 && num(p.stock) <= LOW;
    if (a.pfilter === 'out') return num(p.stock) <= 0;
    if (a.pfilter === 'hidden') return p.available === false;
    return true;
  });
}
function adminRowHTML(p) {
  const id = esc(p.id);
  const flag = p.available === false ? '<span class="pill p-low">Hidden</span>' : num(p.stock) <= 0 ? '<span class="pill p-low">Out</span>' : isLow(p) ? '<span class="pill p-placed">Low</span>' : '';
  return `<tr><td><div class="itemcell"><span class="sw sm" data-cat="${esc(p.category)}"><span class="emo">${esc(p.emoji || '🥬')}</span></span><div><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.category)} · per ${esc(p.unit)}${p.tag ? ' · ' + esc(p.tag) : ''}</div></div></div></td>
    <td><div class="cellwrap">${CONFIG.CURRENCY}<input class="cell" id="pr-${id}" type="number" inputmode="decimal" min="0" step="any" data-f="price" data-id="${id}" value="${num(p.price)}" aria-label="Selling price of ${esc(p.name)}"></div></td>
    <td><div class="cellwrap">${CONFIG.CURRENCY}<input class="cell" id="mr-${id}" type="number" inputmode="decimal" min="0" step="any" data-f="mrp" data-id="${id}" value="${num(p.mrp)}" aria-label="MRP of ${esc(p.name)}"></div></td>
    <td><div class="cellwrap"><input class="cell" id="st-${id}" type="number" inputmode="decimal" min="0" step="any" data-f="stock" data-id="${id}" value="${num(p.stock)}" aria-label="Stock of ${esc(p.name)}">${esc(p.unit)} ${flag}</div></td>
    <td><button class="switch" role="switch" aria-checked="${p.available !== false}" data-act="aToggle" data-id="${id}" aria-label="Available to customers: ${esc(p.name)}"></button></td>
    <td><button class="btn sm" data-act="aEdit" data-id="${id}">Edit</button></td></tr>`;
}
function adminProductsHTML() {
  const a = state.admin, opts = [['all', 'All products'], ['low', 'Low stock'], ['out', 'Out of stock'], ['hidden', 'Hidden from shop']];
  return `<div class="toolbar"><div class="field grow"><label class="sr" for="aq">Search products</label><input id="aq" type="search" placeholder="Search products" value="${esc(a.psearch)}" autocomplete="off"></div>
    <label class="sr" for="afilter">Show</label><select id="afilter">${opts.map(o => `<option value="${o[0]}"${a.pfilter === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select>
    <button class="btn primary" data-act="aAdd">Add product</button></div>
    <p class="muted small">Change a price, MRP or stock number and click outside the box to save. Editing the Google Sheet directly works too; press Refresh to see it here.</p>
    <div class="tablewrap"><table><thead><tr><th>Item</th><th>Selling price</th><th>MRP</th><th>Stock</th><th>Available</th><th></th></tr></thead><tbody id="atbody">${adminRowsHTML()}</tbody></table></div>`;
}
function adminRowsHTML() { const l = adminFiltered(); return l.length ? l.map(adminRowHTML).join('') : `<tr><td colspan="6" class="muted" style="padding:28px;text-align:center">${state.products.length ? 'No products match.' : 'No products yet. Click Add product.'}</td></tr>`; }
function adminOrdersHTML() {
  const a = state.admin, all = a.orders;
  const counts = s => s === 'all' ? all.length : all.filter(o => o.status === s).length;
  const filters = [['all', 'All'], ['placed', 'New'], ['confirmed', 'Confirmed'], ['out_for_delivery', 'Out for delivery'], ['delivered', 'Delivered'], ['cancelled', 'Cancelled']];
  const list = all.filter(o => a.ostatus === 'all' || o.status === a.ostatus);
  return `<div class="chips" role="group" aria-label="Filter orders">${filters.map(f => `<button class="chip" data-act="aOFilter" data-id="${f[0]}" aria-pressed="${a.ostatus === f[0]}">${f[1]} (${counts(f[0])})</button>`).join('')}</div>
    <div class="stack">${list.length ? list.map(adminOrderHTML).join('') : '<p class="muted">No orders in this view yet.</p>'}</div>`;
}
function adminOrderHTML(o) {
  const a = state.admin;
  const acts = (NEXT_STATUS[o.status] || []).map(([to, label]) => {
    if (to === 'cancelled') { const c = a.confirmCancel === o.orderId; return `<button class="btn sm danger" data-act="${c ? 'aStatus' : 'aAskCancel'}" data-id="${esc(o.orderId)}" data-to="cancelled"${a.busy ? ' disabled' : ''}>${c ? 'Yes, cancel order' : label}</button>`; }
    return `<button class="btn sm primary" data-act="aStatus" data-id="${esc(o.orderId)}" data-to="${to}"${a.busy ? ' disabled' : ''}>${label}</button>`;
  }).join('');
  return `<article class="ocard"><div class="ohead"><div><span class="mono"><strong>${esc(o.orderId)}</strong></span> <span class="muted small">${esc(fmtDate(o.createdAt))}</span></div><span class="pill p-${esc(o.status)}">${esc(STATUS_LABEL[o.status] || o.status)}</span></div>
    <div><strong>${esc(o.name)}</strong> · <a href="tel:${esc(o.phone)}" class="mono">${esc(o.phone)}</a><div class="muted small">${esc(o.address)}</div>${o.note ? `<div class="small">Note: ${esc(o.note)}</div>` : ''}</div>
    <div class="items">${o.items.map(i => `<div><span>${esc(i.emoji)} ${esc(i.name)} · ${qtyText(i.qty, i.unit)}</span><span class="mono">${money(i.lineTotal)}</span></div>`).join('')}
    <div><span class="muted">Delivery</span><span class="mono">${o.delivery ? money(o.delivery) : 'Free'}</span></div><div><strong>Collect in cash</strong><strong class="mono">${money(o.total)}</strong></div></div>
    ${acts ? `<div class="acts">${acts}</div>` : ''}</article>`;
}
function adminSettingsHTML() {
  const s = state.settings;
  return `<form id="settingsForm" class="panel" novalidate style="max-width:560px"><h2>Shop settings</h2>
    <div class="field"><label for="s-name">Shop name</label><input id="s-name" value="${esc(s.shopName)}" maxlength="40"></div>
    <div class="row"><div class="field"><label for="s-fee">Delivery charge (${CONFIG.CURRENCY})</label><input id="s-fee" type="number" min="0" step="any" value="${num(s.deliveryFee)}"></div>
    <div class="field"><label for="s-free">Free delivery above (${CONFIG.CURRENCY})</label><input id="s-free" type="number" min="0" step="any" value="${num(s.freeAbove)}"></div></div>
    <div class="field"><label for="s-ann">Notice shown on the shop (optional)</label><input id="s-ann" value="${esc(s.announcement)}" maxlength="160" placeholder="Closed on Sunday afternoon"></div>
    <div><button class="btn primary" type="submit">Save settings</button></div></form>`;
}
function renderModal() {
  const m = state.admin.modal, el = $('#modal');
  if (!m) { el.innerHTML = ''; return; }
  const d = m.draft, cats = catList();
  el.innerHTML = `<div class="modalwrap" data-act="mClose"><form class="modal" id="modalForm" role="dialog" aria-modal="true" aria-label="${m.id ? 'Edit product' : 'Add product'}" novalidate>
    <h2>${m.id ? 'Edit product' : 'Add product'}</h2>
    <div class="formgrid">
      <div class="field wide"><label for="m-name">Name</label><input id="m-name" data-m="name" value="${esc(d.name)}" maxlength="60"></div>
      <div class="field"><label for="m-emoji">Picture (emoji)</label><input id="m-emoji" data-m="emoji" value="${esc(d.emoji)}" maxlength="8"></div>
      <div class="field"><label for="m-cat">Category</label><input id="m-cat" data-m="category" list="m-cats" value="${esc(d.category)}" maxlength="30"><datalist id="m-cats">${cats.concat(['Vegetables', 'Leafy greens', 'Fruits']).filter((c, i, a2) => a2.indexOf(c) === i).map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
      <div class="field"><label for="m-unit">Sold per</label><select id="m-unit" data-m="unit">${UNITS.map(u => `<option${d.unit === u ? ' selected' : ''}>${u}</option>`).join('')}</select></div>
      <div class="field"><label for="m-tag">Tag (optional)</label><input id="m-tag" data-m="tag" value="${esc(d.tag)}" maxlength="24" placeholder="Organic, Farm fresh"></div>
      <div class="field"><label for="m-price">Selling price (${CONFIG.CURRENCY})</label><input id="m-price" data-m="price" type="number" inputmode="decimal" min="0" step="any" value="${esc(d.price)}"></div>
      <div class="field"><label for="m-mrp">MRP (${CONFIG.CURRENCY})</label><input id="m-mrp" data-m="mrp" type="number" inputmode="decimal" min="0" step="any" value="${esc(d.mrp)}"></div>
      <div class="field"><label for="m-stock">Stock count</label><input id="m-stock" data-m="stock" type="number" inputmode="decimal" min="0" step="any" value="${esc(d.stock)}"></div>
      <div class="field"><label for="m-av">Available to customers</label><label style="font-weight:500"><input id="m-av" data-m="available" type="checkbox"${d.available ? ' checked' : ''}> Show in shop</label></div>
    </div>
    ${m.err ? `<p class="err" role="alert">${esc(m.err)}</p>` : ''}
    <div class="acts"><button class="btn primary" type="submit"${m.saving ? ' disabled' : ''}>${m.saving ? 'Saving…' : 'Save product'}</button><button class="btn" type="button" data-act="mClose">Cancel</button>
    ${m.id ? `<button class="btn danger" type="button" data-act="mDelete" style="margin-left:auto"${m.saving ? ' disabled' : ''}>${m.confirmDelete ? 'Yes, delete product' : 'Delete'}</button>` : ''}</div></form></div>`;
  const first = $('#m-name'); if (first && !m.focused) { m.focused = true; first.focus(); }
}

/* ------------------------------ toast ------------------------------ */
let toastTimer;
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (kind === 'bad' ? ' bad' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
}

/* ------------------------------ data loading ------------------------------ */
async function loadCatalog(silent) {
  try {
    const j = await call('catalog');
    state.products = j.products || [];
    state.settings = { ...DEFAULT_SETTINGS, ...(j.settings || {}) };
    state.loaded = true; state.loadError = '';
    reconcileCart();
  } catch (e) {
    if (silent && state.loaded) return;
    state.loadError = e.message;
  }
  softRender();
}
async function adminRefresh(silent) {
  const a = state.admin;
  try {
    const j = await call('adminData', { password: a.pw });
    a.authed = true; a.loginErr = ''; applyAdmin(j.data);
  } catch (e) {
    if (/password/i.test(e.message)) { a.authed = false; a.loginErr = e.message; try { sessionStorage.removeItem('mf-admin-pw'); } catch (x) { /* ignore */ } softRender(); }
    else if (!silent) toast(e.message, 'bad');
  }
}
function applyAdmin(d) {
  state.products = d.products; state.settings = { ...DEFAULT_SETTINGS, ...d.settings }; state.admin.orders = d.orders; state.loaded = true;
  softRender();
}
async function adminMutate(action, payload, okMsg) {
  const a = state.admin; a.busy = true; a.confirmCancel = '';
  try { const j = await call(action, { password: a.pw, ...payload }); a.busy = false; applyAdmin(j.data); if (okMsg) toast(okMsg); return true; }
  catch (e) { a.busy = false; toast(e.message, 'bad'); await adminRefresh(true); return false; }
}
async function refreshMyOrders() {
  for (const m of state.myOrders.slice(0, 8)) {
    try { const j = await call('track', { orderId: m.id, phone: m.phone }); state.tracked[m.id] = j.order; } catch (e) { /* keep older copy */ }
    if (state.route !== 'orders') return;
    softRender();
  }
}

/* ------------------------------ actions ------------------------------ */
function openCart() { state.cartOpen = true; if (state.step === 'done') state.step = 'basket'; renderBar(); renderDrawer(); const b = $('.drawer.open .dhead button'); if (b) b.focus(); }
function closeCart() { state.cartOpen = false; if (state.step === 'done') { state.step = 'basket'; state.placed = null; } renderBar(); renderDrawer(); }

async function placeOrder() {
  const f = state.form, t = cartTotals();
  state.formErr = '';
  if (String(f.name).trim().length < 2) state.formErr = 'Please enter your name';
  else if (digits(f.phone).length !== 10) state.formErr = 'Please enter a 10-digit mobile number';
  else if (String(f.address).trim().length < 6) state.formErr = 'Please enter your delivery address';
  if (state.formErr) { renderDrawer(); return; }
  state.placing = true; renderDrawer();
  try {
    const j = await call('placeOrder', { customer: { name: f.name, phone: f.phone, address: f.address, note: f.note }, website: f.website || '', items: Object.entries(state.cart).map(([id, qty]) => ({ id, qty })) });
    state.placed = j.order; state.step = 'done'; state.cart = {}; store.set('mf-cart', state.cart);
    store.set('mf-form', { name: f.name, phone: f.phone, address: f.address, note: '' });
    state.myOrders = [{ id: j.order.orderId, phone: digits(f.phone) }, ...state.myOrders.filter(m => m.id !== j.order.orderId)].slice(0, 20);
    store.set('mf-orders', state.myOrders); state.tracked[j.order.orderId] = j.order;
    state.placing = false; renderHeader(); renderBar(); renderDrawer(); loadCatalog(true);
  } catch (e) {
    state.placing = false; state.formErr = e.message; state.step = 'details'; renderDrawer(); loadCatalog(true);
  }
}

function validateDraft(d) {
  if (!String(d.name).trim()) return 'Enter a product name';
  if (!(num(d.price) > 0)) return 'Enter a selling price above 0';
  if (d.mrp !== '' && num(d.mrp) < num(d.price)) return 'MRP cannot be lower than the selling price';
  if (d.stock === '' || num(d.stock) < 0) return 'Enter the stock count (0 or more)';
  return '';
}
async function saveModal() {
  const m = state.admin.modal, d = m.draft, err = validateDraft(d);
  if (err) { m.err = err; renderModal(); return; }
  m.err = ''; m.saving = true; renderModal();
  const product = { name: d.name, emoji: d.emoji, category: d.category || 'Vegetables', unit: d.unit, price: num(d.price), mrp: d.mrp === '' ? num(d.price) : num(d.mrp), stock: num(d.stock), available: !!d.available, tag: d.tag };
  if (m.id) product.id = m.id;
  const ok = await adminMutate('adminSaveProduct', { product }, m.id ? 'Product updated' : 'Product added');
  if (ok) { state.admin.modal = null; renderModal(); } else if (state.admin.modal) { state.admin.modal.saving = false; renderModal(); }
}
function onCellChange(el) {
  const p = byId(el.dataset.id), f = el.dataset.f; if (!p) return;
  const raw = el.value.trim(), v = Number(raw), old = p[f];
  let err = '';
  if (raw === '' || !Number.isFinite(v)) err = 'Enter a number';
  else if (f === 'price' && v <= 0) err = 'Selling price must be above 0';
  else if (f === 'price' && v > num(p.mrp)) err = 'Selling price cannot be above the MRP. Raise the MRP first.';
  else if (f === 'mrp' && v < num(p.price)) err = 'MRP cannot be lower than the selling price';
  else if (f === 'stock' && v < 0) err = 'Stock cannot be negative';
  if (err) { toast(err, 'bad'); el.value = num(old); return; }
  if (v === num(old)) return;
  p[f] = v;
  adminMutate('adminSaveProduct', { product: { id: p.id, [f]: v } }, 'Saved ' + p.name);
}

/* ------------------------------ events ------------------------------ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, a = state.admin;
  if (act === 'mClose' && e.target !== el) return;               // clicks inside the modal do not close it
  if (act === 'closeCart' && el.classList.contains('scrim') === false && el.tagName === 'A') { closeCart(); return; }
  switch (act) {
    case 'add': setQty(id, stepOf(byId(id).unit)); break;
    case 'inc': setQty(id, (state.cart[id] || 0) + stepOf(byId(id).unit)); break;
    case 'dec': setQty(id, (state.cart[id] || 0) - stepOf(byId(id).unit)); break;
    case 'cat': state.cat = id; renderChips(); renderGrid(); break;
    case 'retry': state.loadError = ''; renderGrid(); loadCatalog(); break;
    case 'openCart': openCart(); break;
    case 'closeCart': closeCart(); break;
    case 'toDetails': state.step = 'details'; state.formErr = ''; renderDrawer(); { const f = $('#f-name'); if (f) f.focus(); } break;
    case 'backBasket': state.step = 'basket'; renderDrawer(); break;
    case 'cancelMine': {
      if (state.confirmMine !== id) { state.confirmMine = id; softRender(); break; }
      state.confirmMine = '';
      call('cancelOrder', { orderId: id, phone: el.dataset.phone }).then(j => { state.tracked[id] = j.order; toast('Order cancelled'); softRender(); }).catch(err => toast(err.message, 'bad'));
      break;
    }
    case 'aTab': a.tab = id; a.confirmCancel = ''; renderMain(); break;
    case 'aRefresh': adminRefresh().then(() => toast('Up to date')); break;
    case 'aLogout': a.authed = false; a.pw = ''; a.orders = []; try { sessionStorage.removeItem('mf-admin-pw'); } catch (x) { /* ignore */ } renderMain(); break;
    case 'aToggle': { const p = byId(id); if (p && !a.busy) adminMutate('adminSaveProduct', { product: { id, available: p.available === false } }, p.available === false ? p.name + ' is now on sale' : p.name + ' hidden from the shop'); break; }
    case 'aAdd': a.modal = { mode: 'add', id: '', draft: { name: '', emoji: '🥬', category: 'Vegetables', unit: 'kg', price: '', mrp: '', stock: '', tag: '', available: true }, err: '', saving: false, confirmDelete: false }; renderModal(); break;
    case 'aEdit': { const p = byId(id); if (!p) break; a.modal = { mode: 'edit', id, draft: { name: p.name, emoji: p.emoji, category: p.category, unit: p.unit, price: p.price, mrp: p.mrp, stock: p.stock, tag: p.tag || '', available: p.available !== false }, err: '', saving: false, confirmDelete: false }; renderModal(); break; }
    case 'mClose': a.modal = null; renderModal(); break;
    case 'mDelete': {
      const m = a.modal; if (!m) break;
      if (!m.confirmDelete) { m.confirmDelete = true; renderModal(); break; }
      m.saving = true; renderModal();
      adminMutate('adminDeleteProduct', { id: m.id }, 'Product deleted').then(ok => { if (ok) a.modal = null; else if (a.modal) a.modal.saving = false; renderModal(); });
      break;
    }
    case 'aOFilter': a.ostatus = id; a.confirmCancel = ''; renderMain(); break;
    case 'aAskCancel': a.confirmCancel = id; renderMain(); break;
    case 'aStatus': if (!a.busy) adminMutate('adminSetStatus', { orderId: id, status: el.dataset.to }, 'Order ' + id + ' is now ' + (STATUS_LABEL[el.dataset.to] || el.dataset.to).toLowerCase()); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { state.q = t.value; renderGrid(); }
  else if (t.id === 'aq') { state.admin.psearch = t.value; const b = $('#atbody'); if (b) b.innerHTML = adminRowsHTML(); }
  else if (t.dataset.form) { state.form[t.dataset.form] = t.value; if (t.dataset.form !== 'website') store.set('mf-form', { name: state.form.name, phone: state.form.phone, address: state.form.address, note: state.form.note }); }
  else if (t.dataset.track) state.trackForm[t.dataset.track] = t.value;
  else if (t.dataset.m && state.admin.modal) state.admin.modal.draft[t.dataset.m] = t.type === 'checkbox' ? t.checked : t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'afilter') { state.admin.pfilter = t.value; const b = $('#atbody'); if (b) b.innerHTML = adminRowsHTML(); }
  else if (t.classList && t.classList.contains('cell')) onCellChange(t);
});
document.addEventListener('focusout', () => {
  setTimeout(() => { if (state.pending && !isTyping()) { state.pending = false; renderAll(); } }, 60);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.admin.modal) { state.admin.modal = null; renderModal(); }
  else if (state.cartOpen) closeCart();
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const id = e.target.id, a = state.admin;
  if (id === 'checkoutForm') placeOrder();
  else if (id === 'modalForm') saveModal();
  else if (id === 'trackForm') {
    const tf = state.trackForm; state.trackMsg = '';
    if (!tf.id.trim() || digits(tf.phone).length !== 10) { state.trackMsg = 'Enter the order ID and your 10-digit mobile number'; renderMain(); return; }
    try {
      const j = await call('track', { orderId: tf.id.trim(), phone: tf.phone });
      state.tracked[j.order.orderId] = j.order;
      if (!state.myOrders.some(m => m.id === j.order.orderId)) { state.myOrders.unshift({ id: j.order.orderId, phone: digits(tf.phone) }); store.set('mf-orders', state.myOrders); }
      state.trackForm = { id: '', phone: '' };
    } catch (err) { state.trackMsg = err.message; }
    renderMain();
  } else if (id === 'adminLogin') {
    a.pw = $('#a-pw').value; a.checking = true; a.loginErr = ''; renderMain();
    await adminRefresh(false); a.checking = false;
    if (a.authed) { try { sessionStorage.setItem('mf-admin-pw', a.pw); } catch (x) { /* ignore */ } } else if (!a.loginErr) a.loginErr = 'Could not sign in';
    renderMain();
  } else if (id === 'settingsForm') {
    adminMutate('adminSaveSettings', { settings: { shopName: $('#s-name').value, deliveryFee: $('#s-fee').value, freeAbove: $('#s-free').value, announcement: $('#s-ann').value } }, 'Settings saved');
  }
});

/* ------------------------------ routing + start ------------------------------ */
function routeFromHash() { const h = location.hash.replace(/^#\/?/, ''); state.route = h === 'admin' ? 'admin' : h === 'orders' ? 'orders' : 'shop'; }
function onRouteEnter() {
  if (state.route === 'orders') refreshMyOrders();
  if (state.route === 'admin' && !state.admin.authed && state.admin.pw && !state.admin.checking) { state.admin.checking = true; adminRefresh(true).then(() => { state.admin.checking = false; renderMain(); }); }
}
window.addEventListener('hashchange', () => { routeFromHash(); state.cartOpen = false; renderAll(); window.scrollTo(0, 0); onRouteEnter(); });
setInterval(() => {
  if (document.hidden || isTyping()) return;
  if (state.route === 'shop' && state.loaded) loadCatalog(true);
  if (state.route === 'admin' && state.admin.authed && !state.admin.modal && !state.admin.busy) adminRefresh(true);
}, 45000);

routeFromHash(); renderAll(); loadCatalog(); onRouteEnter();
